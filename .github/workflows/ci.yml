name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Install, test, and smoke-run
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: |
          make test

      - name: Run smoke experiment
        run: |
          make smoke
          make summarize

      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurips-smoke-outputs
          path: outputs/neurips_smoke
          if-no-files-found: ignore

  posterior-software-qa:
    name: Corrected posterior pipeline software QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only software dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r experiments/posterior_certificates/requirements.txt
      - name: Source checksums and regression tests
        working-directory: experiments/posterior_certificates
        run: |
          sha256sum -c SHA256SUMS
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
      - name: Software-only smoke, audit and packaging
        working-directory: experiments/posterior_certificates
        run: |
          python -u run_experiment.py --config config.json --out "$RUNNER_TEMP/ste-posterior-v2-software-qa/smoke" --device cpu --smoke
          python package_results.py --out "$RUNNER_TEMP/ste-posterior-v2-software-qa/smoke"
      - name: Upload software QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posterior-v2-software-qa
          path: ${{ runner.temp }}/ste-posterior-v2-software-qa
          if-no-files-found: ignore
