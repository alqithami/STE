project:
  name: ste_ijcai26

reproducibility:
  seed: 42
  # Number of random seeds / repetitions for "main" synthetic experiments.
  num_runs: 10
  # Repetitions for runtime/stability experiments (often fewer is fine).
  num_runs_runtime: 5

synthetic:
  # Defaults (overridden per experiment)
  n_agents: 20
  rho: 0.4
  eta: 0.05
  mu: 0.1
  m_per_pair: 10
  # Cycle injection / cyclicity controls
  cycle_size: 5
  num_cycles: 3
  cycle_edge_prob: 0.9

  # How to inject cyclicity into the base BTL tournament.
  # - edge_only  : only blend the directed cycle edges toward cycle_edge_prob (recommended)
  # - matrix_mix : legacy behavior that can flatten many non-cycle edges toward 0.5
  cycle_injection_mode: edge_only

  # Controls how "strong" the underlying transitive (BTL) signal is.
  # If this is too large, the tournament becomes nearly transitive and
  # changing rho has little effect on the true core sets.
  btl_scale: 0.3

# ---------------------------------------------------------------------------
# Probability estimation: how we build \hat{P} from observed comparisons
# ---------------------------------------------------------------------------
prob_estimation:
  # Options:
  # - empirical_train : Laplace-smoothed counts on TRAIN split only (recommended; non-leaky)
  # - empirical_all   : Laplace-smoothed counts on ALL comparisons (can be slightly optimistic)
  # - learned_btl     : Logistic Bradley-Terry model trained on TRAIN, temperature-scaled on VAL
  method: empirical_train

  # Laplace smoothing for empirical P_hat
  laplace_alpha: 1.0
  # Probability to assign to never-observed pairs (if any)
  fill_value: 0.5

  # Train/val/test split of *comparison rows* (not agents)
  split:
    train: 0.8
    val: 0.1
    test: 0.1

  # Hyperparameters for learned_btl (used only if method=learned_btl)
  learned_btl:
    max_epochs: 200
    batch_size: 512
    lr: 0.05
    weight_decay: 0.0
    patience: 20
    calibrate_temperature: true
    temp_max_iters: 200
    temp_lr: 0.1
    # device: cuda  # optionally force 'cuda' or 'cpu'

ste:
  # Core STE hyperparameters
  tau: 0.05
  K: 3
  alpha: 1.0
  beta_uncovered: 5.0

  # Reachability operator (v5)
  # - max_product: best-path (existence-style) reachability (recommended)
  # - sum_mass: legacy sum of path-masses (can saturate for larger n)
  reachability_mode: max_product

  # Uncovered-set witness sharpness (v5)
  tau_witness: 0.05

  # New (v7): uncovered-set relaxation mode (default: lukasiewicz implication)
  uncovered_mode: lukasiewicz   # lukasiewicz | violation | witness_exp

  # Temperatures for uncovered-set computation (defaults to tau if omitted)
  tau_imp: 0.05        # used for lukasiewicz (soft min over implications)
  tau_violation: 0.05  # used for violation witness smoothmax
  tau_coverer: 0.05    # used to aggregate max coverer

  # Temperature for top-cycle softmin (defaults to tau if omitted)
  tau_softmin: 0.05

evaluation:
  threshold: 0.5
  n_bootstrap: 200
  calibration_bins: 10

baselines:
  elo_epochs: 1

paths:
  output_root: ./outputs
  # Optional real-world datasets (provide paths + enable experiments below)
  chatbot_arena_file: ./data/chatbot_arena/arena_pairwise.csv
  agentbench_file: ./data/agentbench/agentbench_pairwise.jsonl

experiments:
  # -------------------------------------------------------------------------
  # Synthetic (core paper experiments)
  # -------------------------------------------------------------------------
  core_recovery:
    enabled: true
    n_values: [20, 50]
    rho_values: [0.0, 0.2, 0.4, 0.6, 0.8]
    eta: 0.05
    mu: 0.1
    m_per_pair: 10

  robustness:
    enabled: true
    n: 15
    rho: 0.3
    eta_values: [0.0, 0.05, 0.1]
    mu_values: [0.0, 0.1, 0.3]
    m_per_pair: 10

  calibration:
    enabled: true
    n_values: [10, 20, 30]
    rho: 0.3
    eta: 0.05
    mu: 0.1
    m_per_pair: 10

  stability_vs_sparsity:
    enabled: true
    n: 20
    rho: 0.3
    eta: 0.05
    mu_values: [0.0, 0.1, 0.3, 0.5, 0.7]
    m_per_pair: 10
    n_bootstrap: 200

  ablation_K:
    enabled: true
    n: 20
    rho: 0.4
    K_values: [2, 3, 4, 5]
    m_per_pair: 10

  # Honest tau sensitivity (replaces any ambiguous "annealing" proxy)
  ablation_tau:
    enabled: true
    n: 20
    rho: 0.4
    K: 3
    tau_values: [0.2, 0.1, 0.05, 0.02, 0.01]
    m_per_pair: 10

  runtime:
    enabled: true
    n_values: [10, 20, 50, 100, 200]
    rho: 0.3
    eta: 0.05
    mu: 0.1
    m_per_pair: 10

  stability:
    enabled: true
    n: 20
    rho: 0.3
    eta: 0.05
    mu: 0.1
    m_per_pair: 10
    n_bootstrap: 200

  baseline_comparison:
    enabled: true
    n: 20
    rho: 0.4
    eta: 0.05
    mu: 0.1
    m_per_pair: 10

  # -------------------------------------------------------------------------
  # Real-world (optional; enable when data files exist)
  # -------------------------------------------------------------------------
  chatbot_arena_global:
    enabled: false
    file: ./data/chatbot_arena/arena_pairwise.csv
    model_a_col: model_a
    model_b_col: model_b
    winner_col: winner
    category_col: category
    tie_policy: drop  # drop | split
    top_k: 10

  chatbot_arena_by_category:
    enabled: false
    file: ./data/chatbot_arena/arena_pairwise.csv
    model_a_col: model_a
    model_b_col: model_b
    winner_col: winner
    category_col: category
    tie_policy: drop
    top_k: 8

  agentbench_per_environment:
    enabled: false
    file: ./data/agentbench/agentbench_pairwise.jsonl
    agent_a_col: agent_a
    agent_b_col: agent_b
    winner_col: winner
    env_col: environment
    tie_policy: drop
    top_k: 8
